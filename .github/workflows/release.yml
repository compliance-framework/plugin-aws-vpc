# Publishes the plugin (goreleaser archives + gooci upload) when a release is published.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-plugin.yml@e85d35af2af2ddfcd4b92061d2063e665c1831f6 # v1.7.0
    with:
      protocol-version: "2"
    permissions:
      contents: write # goreleaser attaches the archives to the release
      packages: write
    secrets: inherit
